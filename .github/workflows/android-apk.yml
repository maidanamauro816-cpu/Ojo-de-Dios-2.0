name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        env:
          VITE_CCTV_API_BASE: https://ojo-de-dios-cctv.sixsevenapp816.workers.dev
        run: npm run build
      - name: Generate Android project
        run: npx cap add android

      - name: Install Ojo de Dios launcher icon
        run: node scripts/install-android-icon.mjs
      - name: Declare Android location permissions
        run: node scripts/add-android-permissions.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ojo-de-dios-2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
