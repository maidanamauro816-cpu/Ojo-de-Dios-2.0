name: CCTV Mesh validation
on:
  push:
    branches: [feature/cctv-mesh]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run lint
      - run: node --check workers/cctv-proxy.js
      - run: node --check scripts/install-android-icon.mjs
